name: Build Android APK (Android 7+ / API 24+)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK Environment
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          ls -la "$SDK_ROOT/platforms" || true

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> $GITHUB_PATH
          /opt/gradle/gradle-8.9/bin/gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HG6245NMonitor-android7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
